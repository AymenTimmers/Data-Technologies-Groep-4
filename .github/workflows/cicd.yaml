name: CI & CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: webshop-api # Only one image now
  IMAGE_NAMESPACE: abid2001

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Data-Technologies-Groep-4.sln
      - name: Build
        run: dotnet build Data-Technologies-Groep-4.sln -c Release --no-restore
      - name: Test
        run: dotnet test Data-Technologies-Groep-4.sln -c Release --no-build

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./WebShop.Api/Dockerfile # Or ./Dockerfile depending on where you put it
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Manual Deploy
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Trigger Server Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "GITHUB_USER=${{ github.actor }} GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} bash -s" << 'EOF'
            set -e
            cd /home/DataTech/webshop
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
          EOF