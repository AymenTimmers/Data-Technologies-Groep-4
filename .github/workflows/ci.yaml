name: Deploy Webshop

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Data-Technologies-Groep-4/Data-Technologies-Groep-4.sln

      - name: Build
        run: dotnet build Data-Technologies-Groep-4/Data-Technologies-Groep-4.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Data-Technologies-Groep-4/Data-Technologies-Groep-4.sln --configuration Release --no-build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./Data-Technologies-Groep-4/WebShop.Api
          file: ./Data-Technologies-Groep-4/WebShop.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/webshop-api:latest
            ghcr.io/${{ github.repository_owner }}/webshop-api:${{ github.sha }}

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/webshop-frontend:latest
            ghcr.io/${{ github.repository_owner }}/webshop-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Server
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'

            set -euo pipefail

            cd /home/DataTech/webshop || exit 1

            echo "${GHCR_TOKEN}" | docker login ghcr.io \
              -u "${GITHUB_USER}" --password-stdin

            docker compose pull
            docker compose up -d

            docker image prune -f
          EOF
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}