services:
  webshop:
    image: ghcr.io/aymentimmers/webshop-api:latest
    ports:
      - "8080:5088"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5088
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__MongoDb=mongodb://admin:very-long-random-password@mongodb:27017/?authSource=admin
      - ConnectionStrings__Neo4j=bolt://neo4j:7687
    depends_on:
      - redis
      - mongodb
      - neo4j
    restart: always
    networks:
      - backend
    volumes:
      - webshop-logs:/app/Logs

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backend
    volumes:
      - redis-data:/data

  mongodb:
    image: mongo:8
    restart: always
    networks:
      - backend
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: very-long-random-password

  neo4j:
    image: neo4j:5
    restart: always
    networks:
      - backend
    ports:
      - "7474:7474" # Web UI
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/another-long-random-password
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
  
  loki:
    image: grafana/loki:latest
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:latest
    restart: always
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - webshop-logs:/logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  redis-data:
  mongodb-data:
  neo4j-data:
  neo4j-logs:
  grafana-data:
  webshop-logs: